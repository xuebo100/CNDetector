name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Non-blocking: surfaces style/type issues without failing the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip ruff mypy
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy pypdms

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # On Windows the Meson build is driven by MSVC, which is preinstalled on
      # the windows-latest runner image. build_extensions.py automatically adds
      # `-Db_vscrt=mt` so the resulting .pyd statically links the MSVC runtime
      # and needs no external redistributable.
      - name: Install build & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja pybind11 pytest pytest-cov

      - name: Build native extension
        run: python buildtools/build_extensions.py --build_type release

      - name: Run tests
        run: pytest tests/ -v
